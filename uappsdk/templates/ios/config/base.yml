targetTemplates:
    uAppBase:
        type: application
        platform: iOS
        deploymentTarget: '15.0'

        settings:
            CODE_SIGN_STYLE: Manual
            MARKETING_VERSION: 1.0.0
            CURRENT_PROJECT_VERSION: 100
            # 手动签名统一在这里; CODE_SIGN_IDENTITY/DEVELOPMENT_TEAM/
            # PROVISIONING_PROFILE_SPECIFIER/PRODUCT_BUNDLE_IDENTIFIER
            # 分环境配置在 uapp_dev.yml / uapp_test.yml / uapp_release.yml
            # TARGETED_DEVICE_FAMILY: iPhone=1, iPad=2, All=1,2
            TARGETED_DEVICE_FAMILY: 1,2
            ARCHS[sdk=iphoneos*]: '$(ARCHS_STANDARD)'
            ARCHS[sdk=iphonesimulator*]: x86_64
            VALID_ARCHS: "x86_64 arm64"
            DEVELOPMENT_LANGUAGE: zh-Hant-HK
            LD_RUNPATH_SEARCH_PATHS:
                - '$(inherited)'
                - '@executable_path/Frameworks'
            OTHER_LDFLAGS: '$(inherited) -ObjC'
            ENABLE_BITCODE: 'NO'
            VALIDATE_WORKSPACE: 'YES'
            GCC_PRECOMPILE_PREFIX_HEADER: 'YES'
            GCC_PREFIX_HEADER: Main/App-Prefix.pch
            GCC_PREPROCESSOR_DEFINITIONS: '$(inherited) PDR_PLUS_MAP PDR_PLUS_GETUI PDR_PLUS_UMEN'

        sources:
            - path: Main
              excludes:
                  - Pandora
              buildPhase: none

            - path: Main
              includes:
                  - main.m
                  - AppDelegate.m
                  - ViewController.m
                  - SceneDelegate.m
              buildPhase: sources

            - path: Main/Dcloud.swift

            - path: Main/Resources
              type: Bundles
              includes:
                  - en.lproj/InfoPlist.strings
                  - zh-Hans.lproj/InfoPlist.strings
                  - LaunchScreen.storyboard
                  - Images.xcassets
              buildPhase: resources

            - path: Main/Pandora
              type: folder
              buildPhase: resources


        preBuildScripts:
            - path: Main/prebuild-script.sh
        postBuildScripts:
            - path: Main/postbuild-script.sh
