targets:
    uapp-release:
        scheme: {}
        templates:
            - uAppBase
        entitlements:
            path: uapp-release.entitlements
            properties:
                aps-environment: production
                com.apple.developer.applesignin:
                    - Default
        settings:
            CODE_SIGN_IDENTITY: Apple Distribution
            DEVELOPMENT_TEAM: 'YOUR_DEVELOPMENT_TEAM'
            # 按项目实际发布签名修改: 填 profile 的 Name (App Store / ad-hoc 类型)
            PROVISIONING_PROFILE_SPECIFIER: uapp-release
            PRODUCT_BUNDLE_IDENTIFIER: com.example.uapp
            # 按项目修改; 须与 manifest 的 ios.package (DCloud key 申请包名) 和
            # export_release.plist provisioningProfiles 的 key 一致
            INFOPLIST_FILE: '$(SRCROOT)/Main/Resources/AppRelease/Info.plist'
        sources:
            - path: Main/Resources
              type: Bundles
              includes:
                  - AppRelease/control.xml
              buildPhase: resources
